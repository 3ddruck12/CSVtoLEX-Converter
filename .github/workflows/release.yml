name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger bei Tags wie v0.2, v1.0.0, etc.
  workflow_dispatch:  # Manuelles Auslösen über GitHub UI

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up environment
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev python3 python3-pip python3-venv
        
    - name: Build GUI executable
      run: |
        # Erstelle virtuelle Umgebung und installiere Abhängigkeiten
        python3 -m venv build_env
        source build_env/bin/activate
        pip install --upgrade pip
        pip install PySide6 pyinstaller
        
        # Baue die GUI-Executable
        cd csv-konverter
        pyinstaller --clean --noconfirm gui.spec
        
        # Kopiere die neue Executable ins Debian-Paket-Verzeichnis
        cp dist/gui csv-konverter-deb/usr/bin/csv-konverter-dir/gui
        chmod +x csv-konverter-deb/usr/bin/csv-konverter-dir/gui
        echo "GUI-Executable neu gebaut und kopiert"
        
    - name: Get version from tag
      id: get_version
      run: |
        if [ "${{ github.ref_type }}" == "tag" ]; then
          VERSION="${{ github.ref_name }}"
          # Entferne 'v' Präfix falls vorhanden
          VERSION=${VERSION#v}
        else
          VERSION="0.2.6"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
        
    - name: Update Debian control file with version
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        # Aktualisiere die Version in der control-Datei
        sed -i "s/^Version: .*/Version: $VERSION/" csv-konverter-deb/DEBIAN/control
        echo "Version in control-Datei aktualisiert: $VERSION"
        cat csv-konverter-deb/DEBIAN/control
        
    - name: Build Debian package
      run: |
        # Stelle sicher, dass das Startskript ausführbar ist
        chmod +x csv-konverter-deb/usr/bin/csv-konverter
        chmod +x csv-konverter-deb/usr/bin/csv-konverter-dir/gui
        
        # Baue das Debian-Paket
        dpkg-deb --build csv-konverter-deb csv-konverter.deb
        
    - name: Upload Debian package
      uses: actions/upload-artifact@v4
      with:
        name: csv-konverter-deb
        path: csv-konverter.deb

  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install PySide6
        pip install pyinstaller
        
    - name: Build Windows executable
      run: |
        # Finde das richtige Verzeichnis mit gui.spec
        if (Test-Path "csv-konverter\src\gui.spec") {
          $WORK_DIR = "csv-konverter\src"
        } elseif (Test-Path "src\gui.spec") {
          $WORK_DIR = "src"
        } else {
          echo "Fehler: gui.spec nicht gefunden"
          exit 1
        }
        cd $WORK_DIR
        pyinstaller --clean --noconfirm gui.spec
        # Suche nach der erstellten exe-Datei
        $exeFile = Get-ChildItem -Recurse -Filter "*.exe" | Where-Object { $_.DirectoryName -like "*dist*" } | Select-Object -First 1
        if ($exeFile) {
          Copy-Item $exeFile.FullName "..\..\CSVtoLEX.exe"
          echo "Exe-Datei gefunden: $($exeFile.FullName)"
        } else {
          echo "Fehler: Exe-Datei nicht gefunden"
          Get-ChildItem -Recurse -Filter "*.exe" | Select-Object FullName
          exit 1
        }
        
    - name: Upload Windows executable
      uses: actions/upload-artifact@v4
      with:
        name: csv-konverter-windows
        path: CSVtoLEX.exe

  create-release:
    needs: [build-deb, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: '*'
        merge-multiple: false
        path: artifacts
        
    - name: Get version from tag (for release notes)
      id: get_version_release
      run: |
        if [ "${{ github.ref_type }}" == "tag" ]; then
          VERSION="${{ github.ref_name }}"
          # Entferne 'v' Präfix falls vorhanden
          VERSION=${VERSION#v}
        else
          VERSION="dev-$(date +%Y%m%d-%H%M%S)"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/csv-konverter-deb/csv-konverter.deb
          artifacts/csv-konverter-windows/CSVtoLEX.exe
        tag_name: ${{ github.ref_name || format('v{0}', steps.get_version_release.outputs.version) }}
        name: Release ${{ github.ref_name || format('v{0}', steps.get_version_release.outputs.version) }}
        body: |
          ## CSV to LEX Converter Release ${{ github.ref_name || format('v{0}', steps.get_version_release.outputs.version) }}
          
          Automatisch erstelltes Release.
          
          ### Installation
          
          **Debian/Ubuntu/Mint:**
          ```bash
          sudo dpkg -i csv-konverter.deb
          sudo apt-get install -f  # Falls Abhängigkeiten fehlen
          ```
          
          **Windows 10/11:**
          - Laden Sie `CSVtoLEX.exe` herunter
          - Doppelklick zum Starten
          - Bei Windows Defender-Warnungen: "Weitere Informationen" → "Trotzdem ausführen"
          
          ### Änderungen
          - Siehe [Commits](https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }})
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
